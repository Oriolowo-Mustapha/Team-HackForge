name: farmhand
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: 8080
  ConnectionStrings__DefaultConnection: Host=db;Database=farmhand;Username=farmhand;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  Jwt__SecretKey: ${JWT_SECRET:?Set JWT_SECRET}
  Security__FieldEncryptionKey: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY}
  AllowedHosts: api;${PUBLIC_HOST:?Set PUBLIC_HOST}
  App__PublicUrl: https://${PUBLIC_HOST}
  Demo__Enabled: "false"
  Ai__DemoFallback: "false"
  Https__Disabled: "true"
  ReverseProxy__KnownNetworks: ${NETWORK_SUBNET:-172.30.50.0/24}
  Database__MigrateOnStartup: "false"
  Storage__Provider: Local
  Storage__LocalPath: /data/uploads
  Brevo__Enabled: "true"
  Brevo__ApiKey: ${BREVO_API_KEY:?Set BREVO_API_KEY}
  Brevo__FromAddress: ${BREVO_FROM_ADDRESS:?Set BREVO_FROM_ADDRESS}
  Brevo__FromName: FarmHand
  Flutterwave__Mode: ${PAYMENTS_MODE:-Disabled}
  Flutterwave__SecretKey: ${FLUTTERWAVE_SECRET_KEY:-}
  Flutterwave__WebhookSecretHash: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
  Gemini__ApiKey: ${GEMINI_API_KEY:-}
  Groq__ApiKey: ${GROQ_API_KEY:-}
  YarnGpt__ApiKey: ${YARNGPT_API_KEY:-}
  Spitch__ApiKey: ${SPITCH_API_KEY:-}
services:
  edge:
    image: caddy:2
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: farmhand
      POSTGRES_USER: farmhand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U farmhand -d farmhand"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    image: farmhand-api
    command: ["--migrate"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    image: farmhand-api
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  web:
    build: ./web
    environment:
      FARMHAND_API_URL: http://api:8080
      SESSION_COOKIE_SECURE: "true"
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.30.50.0/24}
