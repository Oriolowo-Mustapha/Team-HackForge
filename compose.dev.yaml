name: farmhand-dev
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: farmhand
      POSTGRES_USER: farmhand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.dev first}
    volumes:
      - dev-database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U farmhand -d farmhand"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Database=farmhand;Username=farmhand;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET:?Generate .env.dev first}
      Security__FieldEncryptionKey: ${FIELD_ENCRYPTION_KEY:?Generate .env.dev first}
      Seed__Password: ${SEED_PASSWORD:?Generate .env.dev first}
      AllowedHosts: api;localhost;127.0.0.1
      Demo__Enabled: "true"
      Ai__DemoFallback: "true"
      Flutterwave__Mode: Simulated
      Https__Disabled: "true"
      Storage__Provider: Local
      Storage__LocalPath: /data/uploads
      Brevo__Enabled: "false"
    ports: ["127.0.0.1:5037:8080"]
    volumes:
      - dev-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      FARMHAND_API_URL: http://api:8080
      SESSION_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  dev-database:
  dev-uploads:
